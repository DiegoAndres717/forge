name: Flaky e2e (temporal)

# Temporal (plan #210): repite los tests e2e en macOS para medir por qué se agotan.
on:
  push:
    branches: [fix/flaky-e2e-macos]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  suite:
    strategy:
      fail-fast: false
      matrix:
        run: [1, 2, 3]
    runs-on: macos-latest
    env:
      FORGE_E2E_LOG: ${{ github.workspace }}/e2e-times.tsv
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo test --bin forge --no-run
      - name: Suite del binario
        run: |
          sysctl -n hw.ncpu vm.loadavg
          cargo test --bin forge 2>&1 | tee out.txt
      - name: Esperas más lentas
        if: always()
        run: sort -t$'\t' -k3 -nr e2e-times.tsv | head -40 || true

  solo:
    runs-on: macos-latest
    env:
      FORGE_E2E_LOG: ${{ github.workspace }}/e2e-times.tsv
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo test --bin forge --no-run
      - name: Los inestables, solos, 20 veces
        run: |
          for i in $(seq 20); do
            cargo test --bin forge -- asking_an_agent a_reviewer_opens worktrees_are_listed shift_enter_goes_back > solo-$i.txt 2>&1 || true
            grep -E "FAILED|tiempo agotado|test result" solo-$i.txt || true
          done
          grep -h -A25 "tiempo agotado" solo-*.txt || true
      - name: Esperas más lentas
        if: always()
        run: sort -t$'\t' -k3 -nr e2e-times.tsv | head -40 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-solo
          path: e2e-times.tsv
