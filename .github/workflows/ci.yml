name: CI

on:
  push:
    branches: [main]
  pull_request:

# Solo lectura: un PR (también de forks) no puede escribir en el repo.
permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # Acciones fijadas por commit (no por etiqueta movible); Dependabot las actualiza.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # Ventana (X11/Wayland) y GPU por software (llvmpipe) para los tests de la UI.
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libgl1-mesa-dev mesa-vulkan-drivers zsh
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # Todos los fallos de una vez (sin parar en el primer grupo de tests que falle).
      - run: cargo test --workspace --no-fail-fast

  # La protección de main exige un check llamado «check»: pasa solo si pasan todos los sistemas.
  check:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.build.result }}" = success

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2
        with:
          tool: cargo-audit
      # Vulnerabilidades conocidas (RustSec) en las dependencias de Cargo.lock.
      - run: cargo audit
