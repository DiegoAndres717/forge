name: CI

on:
  push:
    branches: [main]
  pull_request:

# Solo lectura: un PR (también de forks) no puede escribir en el repo.
permissions:
  contents: read

jobs:
  check:
    runs-on: macos-latest
    steps:
      # Acciones fijadas por commit (no por etiqueta movible); Dependabot las actualiza.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2
        with:
          tool: cargo-audit
      # Vulnerabilidades conocidas (RustSec) en las dependencias de Cargo.lock.
      - run: cargo audit
