name: Release

# Al subir una etiqueta vX.Y.Z: compila (universal: Apple Silicon e Intel), genera el .dmg
# y publica la versión con el archivo; después añade los .tar.gz de Linux (x86_64 y aarch64).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-latest
    env:
      # Para actualizar la receta de Homebrew (DiegoAndres717/homebrew-tap); sin él, se salta.
      TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Comprobar que la etiqueta coincide con la versión
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          test "v$VERSION" = "$GITHUB_REF_NAME"
      - run: ./scripts/make-dmg.sh
      # Huella que la app comprueba antes de instalar una actualización.
      - run: cd dist && for f in *.dmg; do shasum -a 256 "$f" > "$f.sha256"; done
      - name: Publicar
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.dmg dist/*.dmg.sha256 --title "Forge $GITHUB_REF_NAME" --generate-notes
      - name: Actualizar Homebrew (brew install --cask diegoandres717/tap/forge)
        if: env.TAP_TOKEN != ''
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          SHA=$(cut -d' ' -f1 "dist/Forge-$VERSION.dmg.sha256")
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/DiegoAndres717/homebrew-tap.git" tap
          mkdir -p tap/Casks
          ./scripts/cask.sh "$VERSION" "$SHA" > tap/Casks/forge.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/forge.rb
          git commit -m "forge $VERSION"
          git push

  # Linux: el binario solo, en un .tar.gz por arquitectura (lo instala scripts/install.sh).
  linux:
    needs: dmg
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libgl1-mesa-dev
      - run: cargo build --release --locked
      - name: Empaquetar
        run: |
          NAME="forge-${GITHUB_REF_NAME#v}-linux-${{ matrix.arch }}.tar.gz"
          mkdir -p dist
          tar -czf "dist/$NAME" -C target/release forge
          cd dist && sha256sum "$NAME" > "$NAME.sha256"
      - name: Publicar
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.tar.gz.sha256

  # Windows: forge.exe en un .zip por arquitectura (lo instala scripts/install.ps1).
  windows:
    needs: dmg
    strategy:
      matrix:
        include:
          - runner: windows-latest
            arch: x86_64
          - runner: windows-11-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo build --release --locked
      - name: Empaquetar
        run: |
          $name = "forge-$($env:GITHUB_REF_NAME.TrimStart('v'))-windows-${{ matrix.arch }}.zip"
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path target\release\forge.exe -DestinationPath "dist\$name"
          $hash = (Get-FileHash "dist\$name" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name" | Out-File -Encoding ascii -NoNewline "dist\$name.sha256"
      - name: Publicar
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload $env:GITHUB_REF_NAME (Get-ChildItem dist\*.zip, dist\*.sha256).FullName
