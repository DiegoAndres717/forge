name: Release

# Al subir una etiqueta vX.Y.Z: compila (universal: Apple Silicon e Intel), genera el .dmg
# y publica la versión con el archivo.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Comprobar que la etiqueta coincide con la versión
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          test "v$VERSION" = "$GITHUB_REF_NAME"
      - run: ./scripts/make-dmg.sh
      - name: Publicar
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.dmg --title "Forge $GITHUB_REF_NAME" --generate-notes
