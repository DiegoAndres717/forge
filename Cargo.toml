[workspace]
members = ["crates/forge-core"]

[workspace.package]
version = "0.13.4"
repository = "https://github.com/DiegoAndres717/forge"
edition = "2024"
# Mínimo para compilar (lo exigen egui y otras dependencias): cargo avisa claro con un Rust
# más viejo.
rust-version = "1.95"
license = "MIT"

[workspace.dependencies]
libc = "0.2.190"
regex = "1.13.1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
toml = "1.1.6"

# La app (ventana + CLI) es el paquete raíz; la lógica vive en crates/forge-core.
[package]
name = "forge"
version.workspace = true
repository.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
forge-core = { path = "crates/forge-core" }
alacritty_terminal = "0.26.0"
base64 = "0.22.1"
eframe = "0.36.2"
egui-phosphor = "0.14.0"
libc.workspace = true
portable-pty = "0.9.0"
# Pegar imágenes en la terminal: ya vienen con eframe (mismas versiones).
arboard = { version = "3.6", default-features = false, features = ["image-data"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
# Color de sintaxis del editor de archivos (regex en Rust puro: sin compilar C).
syntect = { version = "5", default-features = false, features = ["parsing", "regex-fancy"] }
# Gramáticas extra (TypeScript, TOML…) y temas oscuros ya incluidos.
two-face = { version = "0.4", default-features = false, features = ["syntect-fancy"] }
notify = "8.2.1"

# Integración nativa de macOS: menú, semáforos, notificaciones y editores.
[target.'cfg(target_os = "macos")'.dependencies]
mac-notification-sys = "0.6"
objc2 = "0.6"
raw-window-handle = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSApplication", "NSWindow", "NSButton", "NSView", "NSResponder", "NSControl", "NSWorkspace", "NSImage", "NSImageRep", "NSBitmapImageRep", "NSGraphicsContext", "NSGraphics", "objc2-core-foundation"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["NSGeometry", "NSString", "NSURL"] }
muda = { version = "0.17", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
notify-rust = "4.18.2"

# Windows: sonidos de los avisos sin arrancar PowerShell.
# Icono dentro de forge.exe (lo usa build.rs solo al compilar para Windows).
[build-dependencies]
winresource = "0.1"

[target.'cfg(windows)'.dependencies]
# Selector de carpetas moderno (IFileOpenDialog); sin features: las de Linux no aplican.
rfd = { version = "0.17", default-features = false }
windows-sys = { version = "0.61", features = [
    "Win32_Media_Audio",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
egui_kittest = { version = "0.36.2", features = ["wgpu", "snapshot", "eframe"] }
rusqlite.workspace = true

# La app final: LTO «thin» (más rápida y pequeña sin alargar mucho la compilación) y sin
# símbolos de depuración.
[profile.release]
lto = "thin"
strip = "symbols"
