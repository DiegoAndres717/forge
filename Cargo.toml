[workspace]
members = ["crates/forge-core"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
libc = "0.2.190"
regex = "1.13.1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
toml = "1.1.6"

# La app (ventana + CLI) es el paquete raíz; la lógica vive en crates/forge-core.
[package]
name = "forge"
version.workspace = true
edition.workspace = true

[dependencies]
forge-core = { path = "crates/forge-core" }
alacritty_terminal = "0.26.0"
eframe = "0.36.2"
egui-phosphor = "0.14.0"
libc.workspace = true
portable-pty = "0.9.0"
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
mac-notification-sys = "0.6"

[dev-dependencies]
egui_kittest = { version = "0.36.2", features = ["wgpu", "snapshot", "eframe"] }
rusqlite.workspace = true
