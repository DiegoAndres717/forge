[package]
name = "forge-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
libc.workspace = true
regex.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
toml.workspace = true
toml_edit = "0.25"
# Búsqueda por significado en Forge Memory (opcional; el modelo se descarga al activarla).
# Rust puro salvo onig (C, compilado dentro del binario): nada que distribuir aparte.
candle-core = "0.11.0"
candle-nn = "0.11.0"
candle-transformers = "0.11.0"
tokenizers = { version = "0.22", default-features = false, features = ["onig"] }

# Windows: saber si un proceso sigue vivo (Guard espera respuestas de la app).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_System_Threading",
] }
